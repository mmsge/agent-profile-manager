name: Release

# A tag is the release. Nothing is published from a branch, so every artifact
# corresponds to a commit anyone can check out and rebuild.
#
# Two ways in, one path out. Pushing a v* tag is still the way to cut a
# release, and nothing about it changes. The manual run exists because pushing
# a tag needs git write access to this repository, and the person cutting the
# release does not always have it from where they are sitting. It creates the
# same tag, from the same commit, and then does the same thing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to release, without the leading v, for example 0.8.0. It must
          equal AGENT_PROFILE_VERSION on the branch this is run from, which is
          checked before anything is built or tagged.
        required: true
        type: string

permissions:
  contents: read

jobs:
  # The same matrix branches run, called rather than copied. A release that
  # skipped a check would be worse than no release at all.
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      # What the formula job below needs to know, and the only thing it is
      # told: which release to read.
      tag: ${{ steps.v.outputs.tag }}
    permissions:
      # Create the release and upload its assets.
      contents: write
      # Mint the OIDC token cosign signs with. Keyless signing is exactly this
      # token, exchanged for a short-lived certificate, so without it there is
      # nothing to sign with.
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          # The manual path pushes a tag from here, and the default shallow
          # clone has no ref to push. It also keeps the tarball's mtime step
          # reading the same commit date either way.
          fetch-depth: 0

      # A tag that disagrees with the version the script reports is a release
      # nobody can reason about: 'agpin version' would name one thing and the
      # tarball another. Fail here rather than publish that.
      #
      # On a tag push the tag is the input. On a manual run the version is,
      # and the tag is derived from it, so the two paths meet at the same
      # comparison below rather than each having their own.
      - name: Check the tag against the version in the script
        id: v
        # Through the environment, never interpolated into the script. A
        # ${{ }} expansion is pasted in as text before the shell sees it, so a
        # crafted input would run as code in a job that holds contents: write
        # and an OIDC signing token. This is the one place a person's typing
        # reaches this workflow, so it goes in as data.
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$DISPATCH_VERSION"
            # Typed by a person, so say what is wrong rather than failing later
            # with a tag nobody meant to create.
            case "$version" in
              v*) echo "version is '$version'; give it without the leading v." >&2; exit 1 ;;
              ''|*[!0-9.]*) echo "version '$version' is not digits and dots, like 0.8.0." >&2; exit 1 ;;
            esac
            tag="v$version"
          else
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
          fi
          reported=$(sed -n 's/^AGENT_PROFILE_VERSION="\(.*\)"$/\1/p' bin/agent-profile | head -1)
          if [ -z "$reported" ]; then
            echo "could not read AGENT_PROFILE_VERSION from bin/agent-profile" >&2
            exit 1
          fi
          if [ "$version" != "$reported" ]; then
            echo "tag $tag means version $version, but bin/agent-profile says $reported." >&2
            echo "Bump AGENT_PROFILE_VERSION in the commit you tag." >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # A manual run can be pointed at any branch. A release built from
            # an unmerged branch would carry code that never passed review, so
            # only the default branch may be released from. A tag push is not
            # checked this way: a tag already names one immutable commit.
            if [ -z "$DEFAULT_BRANCH" ]; then
              echo "could not read the repository's default branch, so the branch this" >&2
              echo "run was started from cannot be checked. Refusing rather than guessing." >&2
              exit 1
            fi
            if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
              echo "manual releases run from $DEFAULT_BRANCH only, not $GITHUB_REF_NAME." >&2
              exit 1
            fi
            # Never move a tag that exists. Whatever it points at has been
            # published, downloaded and checksummed by somebody.
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "tag $tag already exists. Bump AGENT_PROFILE_VERSION instead of re-cutting it." >&2
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tarball=agent-profile-$version.tar.gz" >> "$GITHUB_OUTPUT"

      # Built with fixed ownership, fixed order and the commit's own timestamp,
      # so anyone who checks the tag out can rebuild the tarball and get the
      # same sha256. A checksum you cannot reproduce only proves the file did
      # not change in transit.
      - name: Build the tarball
        run: |
          set -eu
          version="${{ steps.v.outputs.version }}"
          stage="dist/agent-profile-$version"
          mkdir -p "$stage"
          cp -R bin tools docs "$stage/"
          cp README.md "$stage/"
          if [ -f LICENSE ]; then cp LICENSE "$stage/"; fi
          tar --sort=name --owner=0 --group=0 --numeric-owner \
              --mtime="@$(git log -1 --format=%ct)" \
              -czf "dist/${{ steps.v.outputs.tarball }}" -C dist "agent-profile-$version"
          rm -rf "$stage"
          cd dist
          # The same two-space format 'shasum -a 256 -c' reads on macOS, which
          # is what tools/install.sh verifies the download with.
          sha256sum "${{ steps.v.outputs.tarball }}" > SHA256SUMS
          cat SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless: no private key exists to leak or to rotate. The certificate
      # records the workflow, the repository and the tag, which is what
      # tools/install.sh checks the bundle against.
      - name: Sign the tarball and the checksums
        run: |
          set -eu
          cd dist
          for f in "${{ steps.v.outputs.tarball }}" SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore" "$f"
          done
          ls -l

      - name: Write the release notes
        run: |
          set -eu
          cat > dist/NOTES.md <<NOTES
          Install:

              curl -fsSL https://raw.githubusercontent.com/mmsge/agent-profile-manager/hovud/tools/install.sh | bash

          That downloads this release, verifies it and installs a copy. To pin
          this version explicitly:

              tools/install.sh --version ${{ steps.v.outputs.tag }}

          ## Verifying by hand

              shasum -a 256 -c SHA256SUMS
              cosign verify-blob \\
                --bundle ${{ steps.v.outputs.tarball }}.sigstore \\
                --certificate-identity-regexp '^https://github\.com/mmsge/agent-profile-manager/\.github/workflows/release\.yml@refs/tags/' \\
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
                ${{ steps.v.outputs.tarball }}

          The signature is keyless Sigstore. There is no public key to fetch
          and no private key to steal: the certificate names the workflow, the
          repository and the tag that produced the file.
          NOTES

      # Last, deliberately. Everything above can fail without leaving a trace;
      # a tag cannot. Created here, a build that breaks or a signature that
      # will not mint leaves the repository exactly as it was, and the run can
      # simply be started again. Created earlier, every failed attempt would
      # burn a version number.
      #
      # Skipped on a tag push, where the tag is what started the run.
      #
      # This tag is annotated but not signed: the runner has no signing key,
      # and putting one there would mean a release key living in repository
      # secrets, which is worse than an unsigned tag. What identifies the
      # release is the Sigstore certificate on the artifacts below, which
      # records this workflow, this repository and this tag, and the run this
      # tag names. A tag cut by hand with 'git tag -s' still carries a human
      # signature, and that path is unchanged.
      - name: Create the tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -eu
          tag="${{ steps.v.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "agent-profile ${{ steps.v.outputs.version }}"
          git push origin "refs/tags/$tag"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "${{ steps.v.outputs.tag }}" \
            --verify-tag \
            --title "${{ steps.v.outputs.tag }}" \
            --notes-file dist/NOTES.md \
            --generate-notes \
            "dist/${{ steps.v.outputs.tarball }}" \
            "dist/${{ steps.v.outputs.tarball }}.sigstore" \
            dist/SHA256SUMS \
            dist/SHA256SUMS.sigstore

  # The release exists, so the Homebrew formula can name it. That happens in
  # homebrew-formula.yml, which opens a pull request rather than pushing, and
  # this is how it hears about a release cut here.
  #
  # It has to be told. The release above is published with GITHUB_TOKEN, and
  # GitHub starts no workflow run from an event a GITHUB_TOKEN caused, so
  # release: published never fires for it. workflow_dispatch is the documented
  # exception, and asking for it explicitly is clearer than a release that
  # silently does not reach the workflow written for it.
  #
  # Its own job, holding one permission the publish job above does not need
  # and not holding any of that job's. A failure here changes nothing about
  # the release: it is published, signed and installable, and the formula can
  # be proposed afterwards by running that workflow from the Actions tab with
  # this tag, or by tools/update-homebrew-formula.sh from a checkout.
  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Ask for the Homebrew formula pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.publish.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          if [ -z "$DEFAULT_BRANCH" ]; then
            echo "could not read the repository's default branch, so there is no ref" >&2
            echo "to run the formula workflow from. The release is published; run the" >&2
            echo "Homebrew formula workflow by hand with tag $TAG." >&2
            exit 1
          fi
          gh workflow run homebrew-formula.yml --ref "$DEFAULT_BRANCH" -f tag="$TAG"
          echo "Asked homebrew-formula.yml for a pull request pinning $TAG."
