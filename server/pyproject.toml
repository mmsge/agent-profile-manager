[project]
name = "agent-profile-sessions"
version = "0.11.0"
description = "A read-only MCP server over one Claude Code config root's transcripts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastmcp==4.0.3"]

[project.scripts]
agent-profile-sessions = "agent_profile_sessions.__main__:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_profile_sessions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
